name: Verify sync on 3 platforms

# 用途：验证「数据同步」相关功能在 Windows / macOS / Linux 上是否真的可用。
# 触发：main 或 verify/** 分支改动 novelreader/tests 时；也可手动 workflow_dispatch。

on:
  push:
    branches: [main, 'verify/**']
    paths:
      - 'novelreader/**'
      - 'tests/**'
      - '.github/workflows/verify-cross.yml'
  workflow_dispatch:

jobs:
  sync-core:
    name: sync-core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q novelreader
      - name: Import smoke (lan_server / sync_engine / content_key)
        run: python -c "import novelreader.lan_server as l, novelreader.sync_engine as s, novelreader.content_key as c; print('import ok', l.DEFAULT_PORT, s.SCHEMA_VERSION, c.CK_VERSION)"
      - name: LAN server protocol tests (38)
        run: python tests/test_lan_server.py
      - name: LAN end-to-end sync flow tests (15)
        run: python tests/test_lan_sync_flow.py
      - name: Cloud WebDAV sync engine tests (20)
        run: python tests/test_sync_engine_v2.py
      - name: Cache layout / content_key tests
        run: |
          python tests/test_cache_layout.py
          python tests/test_cache_layout_flow.py

  gui-wiring-linux:
    name: gui-wiring (linux, xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: GUI wiring test (headless via Xvfb)
        run: xvfb-run -a python tests/test_lan_gui_wiring.py
