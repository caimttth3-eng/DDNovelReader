name: Build

on:
  push:
    branches: [main]
    paths:
      - 'novelreader/**'
      - 'requirements.txt'
      - '多多朗读.spec'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Test
        run: |
          python -m compileall -q novelreader
          python -c "import novelreader.tts_engine as t; assert t._IS_WINDOWS is True, 'Windows 应走 MCI'"
      - name: Build
        run: python -m PyInstaller --clean --noconfirm 多多朗读.spec
      - uses: actions/upload-artifact@v4
        with:
          name: DDNovelReader-Windows
          path: dist/多多朗读.exe

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pyobjc-framework-Cocoa
      - name: Test
        run: |
          python -m compileall -q novelreader
          python -c "import novelreader.tts_engine as t; assert t._IS_WINDOWS is False, 'macOS 应走 pygame'"
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name DDNovelReader --collect-all tkinterdnd2 --collect-submodules pyttsx3 novelreader/main.py
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent dist/DDNovelReader.app DDNovelReader-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DDNovelReader-macOS
          path: DDNovelReader-macOS.zip

  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk espeak-ng python3-pip
      - name: Install Python deps
        run: |
          pip3 install --break-system-packages --upgrade pip
          pip3 install --break-system-packages -r requirements.txt pyinstaller
      - name: Test
        run: |
          python3 -m compileall -q novelreader
          python3 -c "import novelreader.tts_engine as t; assert t._IS_WINDOWS is False, 'Linux 应走 pygame'"
      - name: Build
        run: python3 -m PyInstaller --noconfirm --clean --onefile --name DDNovelReader --collect-all tkinterdnd2 --collect-submodules pyttsx3 novelreader/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: DDNovelReader-Linux
          path: dist/DDNovelReader
